<!doctype html>
<!--
  ============================================================================
  ESTE ARCHIVO NO SE DESPLIEGA. Es solo para desarrollo local.
  ============================================================================

  Usa rutas relativas (./src/app.js) que en Webflow no resuelven a nada.
  Si lo pegas ahi, la app no carga.

  Para Webflow: pega webflow/embed.html y nada mas.

  Uso local:  python -m http.server 5173 --bind 127.0.0.1
              http://localhost:5173
  Otro backend:  http://localhost:5173/?api=http://localhost:8000
  ============================================================================
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartCheck</title>

    <script>
      // En Webflow esto no hace falta: src/api.js ya trae el backend por default.
      var apiOverride = new URLSearchParams(location.search).get("api");
      if (apiOverride) window.SMARTCHECK_API = apiOverride;
    </script>

    <link rel="stylesheet" href="./src/app.css" />
    <style>
      body {
        margin: 0;
        padding: 48px 20px;
        font-family:
          system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #fff;
        color: #0f172a;
      }
      .page-head {
        max-width: 980px;
        margin: 0 auto 32px;
      }
      .page-head h1 {
        margin: 0 0 8px;
        font-size: 2rem;
        letter-spacing: -0.02em;
      }
      .page-head p {
        margin: 0;
        max-width: 62ch;
        color: #64748b;
        line-height: 1.6;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #f1f5f9;
        }
        .page-head p {
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-head">
      <h1>SmartCheck</h1>
      <p>
        Auditá un contrato Solidity contra las 10 categorías del OWASP Smart
        Contract Security Top 10. Pegá una dirección de testnet o el código
        fuente, y recibí un checklist en lenguaje claro con la línea exacta de
        cada hallazgo.
      </p>
    </div>

    <div id="smartcheck-app"></div>

    <script type="module">
      import { mount } from "./src/app.js";
      mount("#smartcheck-app");
    </script>
  </body>
</html>
