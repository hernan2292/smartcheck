  SmartCheck — snippet para el body de la pagina

  DONDE: arrastrá un elemento "Embed" (Add panel > Components > Embed) al lugar

  ALTERNATIVA: si preferis, poné solo el <div> en el Embed y el <script> en

  IMPORTANTE: reemplazá TU-USUARIO/TU-REPO por tu repo de GitHub (publico).
-->

<div id="smartcheck-app"></div>

<script type="module">

</script>
