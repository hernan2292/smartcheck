<!--
  ============================================================================
  SmartCheck — ESTO ES LO UNICO QUE HAY QUE PEGAR EN WEBFLOW
  ============================================================================

  DONDE: Add panel > Components > Embed. Arrastralo donde quieras la app y pega
         todo este bloque adentro.

  NO hay nada que reemplazar y NO hay que pegar nada en el <head>: este snippet
  carga sus propios estilos.

  NO pegues index.html del repo — ese archivo es solo para desarrollo local y
  usa rutas relativas que en Webflow no resuelven.

  ---------------------------------------------------------------------------
  Version fijada a proposito (@v0.1.2)

  jsDelivr cachea un branch hasta 12h, asi que con @main los cambios aparecen
  en un momento impredecible. Con un tag sabes exactamente que se esta sirviendo.
  Para publicar cambios: `git tag v0.1.3 && git push origin v0.1.3` y cambias el
  numero en las dos URLs de abajo.
  ---------------------------------------------------------------------------
-->

<div id="smartcheck-app">
  <p style="color: #64748b; font-size: 0.9375rem">Cargando el auditor…</p>
</div>

<script type="module">
  const VERSION = "v0.1.2";
  const BASE = `https://cdn.jsdelivr.net/gh/hernan2292/smartcheck@${VERSION}/src`;
  const MOUNT = "#smartcheck-app";

  /** Carga el stylesheet y espera a que este listo, para que no haya un flash sin estilos. */
  function loadStyles(href) {
    return new Promise((resolve) => {
      if (document.querySelector(`link[href="${href}"]`)) return resolve();
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = href;
      link.onload = resolve;
      // Si el CSS no carga, mejor mostrar la app sin estilo que no mostrarla.
      link.onerror = resolve;
      document.head.appendChild(link);
      setTimeout(resolve, 3000);
    });
  }

  try {
    await loadStyles(`${BASE}/app.css`);
    const { mount } = await import(`${BASE}/app.js`);
    await mount(MOUNT);
  } catch (error) {
    // Sin esto, si el modulo no carga (CDN caido, red del visitante, un
    // bloqueador) el visitante ve un div vacio y no hay forma de saber por que.
    console.error("[smartcheck] no se pudo cargar desde", BASE, error);
    const node = document.querySelector(MOUNT);
    if (node) {
      node.textContent = "";
      const msg = document.createElement("p");
      msg.style.cssText =
        "padding:14px 16px;border-radius:10px;background:#f8fafc;" +
        "border-left:4px solid #dc2626;color:#0f172a;font-size:0.9375rem";
      msg.textContent = "No se pudo cargar el auditor. Probá recargando la página.";
      node.appendChild(msg);
    }
  }
</script>
