<!--
  SmartCheck — snippet para el body de la pagina

  DONDE: arrastrá un elemento "Embed" (Add panel > Components > Embed) al lugar
         de la pagina donde quieras la app, y pegá esto adentro.

  ALTERNATIVA: si preferis, poné solo el <div> en el Embed y el <script> en
  Page Settings > Custom Code > Before </body> tag. Da igual, pero el script
  tiene que cargar DESPUES del div (por eso lleva type="module", que ya es
  deferido por definicion).

  NOTA: jsDelivr cachea un branch hasta 12h. Para forzar refresh en una demo,
  cambiá @main por un tag de version, ej. @v0.1.1
-->

<div id="smartcheck-app"></div>

<script type="module">
  import { mount } from "https://cdn.jsdelivr.net/gh/hernan2292/smartcheck@main/src/app.js";
  mount("#smartcheck-app");
</script>
